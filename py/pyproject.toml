[project]
name = "pagesequence"
version = "2.0.0rc2"
description = "Map the pages of a document (like a PDF) to the labels printed on them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lasse Hellman", email = "github@tvartom.com" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/publication-md/pagesequence"
Specification = "https://github.com/publication-md/pagesequence/blob/main/spec/pagesequence.md"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
