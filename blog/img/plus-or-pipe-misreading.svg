<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 276" width="600" height="276">
  <title>1,2|3,4|5,6|7,8 means five pages: a cover, the spreads 2 and 3, 4 and 5, 6 and 7, and a back cover. It was read as four spreads: 1 and 2, 3 and 4, 5 and 6, 7 and 8.</title>
  <style>
    .ink { fill: #1f2328 } .muted { fill: #59636e }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3 } .muted { fill: #9198a1 }
    }
    .print { fill: #1f2328; font-family: Georgia, "Times New Roman", serif; font-size: 13px }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px }
    .join { fill: #d9480f }
    .wrong { fill: #d9480f }
  </style>
  <defs>
    <!-- The page shapes of the publication-md logo, with thinner lines. -->
    <symbol id="spread" viewBox="28 50 200 160">
      <g stroke="currentColor" stroke-width="6" stroke-linejoin="round" fill="#ffffff">
        <path d="M128 72 C104 56 64 54 32 62 V194 C64 186 104 188 128 204 Z"/>
        <path d="M128 72 C152 56 192 54 224 62 V194 C192 186 152 188 128 204 Z"/>
      </g>
      <g stroke-width="4" stroke-linecap="round" stroke="#8c959f">
        <line x1="52" y1="92" x2="96" y2="94" stroke="#d9480f" stroke-width="8"/>
        <line x1="52" y1="116" x2="108" y2="119"/>
        <line x1="52" y1="136" x2="108" y2="139"/>
        <line x1="148" y1="94" x2="204" y2="92"/>
        <line x1="148" y1="119" x2="204" y2="116"/>
        <line x1="148" y1="139" x2="204" y2="136"/>
      </g>
    </symbol>
    <symbol id="cover" viewBox="28 50 104 160">
      <rect x="32" y="62" width="96" height="132" fill="#ffffff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
      <line x1="52" y1="96" x2="108" y2="96" stroke="#d9480f" stroke-width="12" stroke-linecap="round"/>
      <line x1="52" y1="122" x2="92" y2="122" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="leaf" viewBox="28 50 104 160">
      <rect x="32" y="62" width="96" height="132" fill="#ffffff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
      <g stroke-width="4" stroke-linecap="round" stroke="#8c959f">
        <line x1="52" y1="96" x2="108" y2="96"/>
        <line x1="52" y1="116" x2="108" y2="116"/>
        <line x1="52" y1="136" x2="96" y2="136"/>
      </g>
    </symbol>
  </defs>

  <!-- Meant: five document pages, a cover, three spreads and a back cover. -->
  <text class="sans ink" x="16" y="58" font-weight="600">meant</text>
  <text class="sans muted" x="16" y="74">five pages</text>
  <g color="#1f2328">
    <use xlink:href="#cover" href="#cover" x="100" y="16" width="52" height="80"/>
    <use xlink:href="#spread" href="#spread" x="170" y="16" width="100" height="80"/>
    <use xlink:href="#spread" href="#spread" x="288" y="16" width="100" height="80"/>
    <use xlink:href="#spread" href="#spread" x="406" y="16" width="100" height="80"/>
    <use xlink:href="#leaf" href="#leaf" x="524" y="16" width="52" height="80"/>
  </g>
  <g class="print">
    <text x="142" y="81" text-anchor="end">1</text>
    <text x="180" y="81">2</text><text x="260" y="81" text-anchor="end">3</text>
    <text x="298" y="81">4</text><text x="378" y="81" text-anchor="end">5</text>
    <text x="416" y="81">6</text><text x="496" y="81" text-anchor="end">7</text>
    <text x="534" y="81">8</text>
  </g>
  <g class="code ink" text-anchor="middle">
    <text x="126" y="124">1</text><text x="160" y="124">,</text>
    <text x="220" y="124">2<tspan class="join">|</tspan>3</text><text x="278" y="124">,</text>
    <text x="338" y="124">4<tspan class="join">|</tspan>5</text><text x="396" y="124">,</text>
    <text x="456" y="124">6<tspan class="join">|</tspan>7</text><text x="514" y="124">,</text>
    <text x="550" y="124">8</text>
  </g>

  <!-- Read as: four document pages, split at the pipes. -->
  <text class="sans wrong" x="16" y="192" font-weight="600">read as</text>
  <text class="sans muted" x="16" y="208">four pages</text>
  <g color="#d9480f">
    <use xlink:href="#spread" href="#spread" x="100" y="150" width="100" height="80"/>
    <use xlink:href="#spread" href="#spread" x="218" y="150" width="100" height="80"/>
    <use xlink:href="#spread" href="#spread" x="336" y="150" width="100" height="80"/>
    <use xlink:href="#spread" href="#spread" x="454" y="150" width="100" height="80"/>
  </g>
  <g class="print">
    <text x="110" y="215">1</text><text x="190" y="215" text-anchor="end">2</text>
    <text x="228" y="215">3</text><text x="308" y="215" text-anchor="end">4</text>
    <text x="346" y="215">5</text><text x="426" y="215" text-anchor="end">6</text>
    <text x="464" y="215">7</text><text x="544" y="215" text-anchor="end">8</text>
  </g>
  <g class="code ink" text-anchor="middle">
    <text x="150" y="258">1,2</text>
    <text x="209" y="258" class="join">|</text>
    <text x="268" y="258">3,4</text>
    <text x="327" y="258" class="join">|</text>
    <text x="386" y="258">5,6</text>
    <text x="445" y="258" class="join">|</text>
    <text x="504" y="258">7,8</text>
  </g>
</svg>
